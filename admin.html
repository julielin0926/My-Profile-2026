<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>作品管理 | My Profile</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <main>
        <section class="admin">
            <h1>新增作品</h1>

            <p id="authStatus" role="status">正在確認登入狀態…</p>

            <div class="admin-actions">
                <a href="index.html">回首頁</a>
                <button type="button" id="logoutButton">登出</button>
            </div>

            <form id="workForm">
                <fieldset id="workFields" disabled>
                    <legend>作品資料</legend>

                    <label for="title">作品名稱</label>
                    <input id="title" maxlength="120" required>

                    <label for="description">作品介紹</label>
                    <textarea id="description" rows="6" maxlength="10000"
                        placeholder="介紹作品的故事、創作理念、使用工具或你的負責內容"></textarea>

                    <!-- ==================== 作品精華畫面 ==================== -->

                    <fieldset id="workImageFields">
                        <legend>作品精華畫面</legend>
                        <label for="workImages">
                            上傳作品精華畫面
                        </label>
                        <input
                            id="workImages"
                            type="file"
                            accept="image/png,image/jpeg,image/webp"
                            multiple
                        >
                        <p class="field-hint">
                            可一次選擇多張圖片，適用於動畫、影音及遊戲作品。
                        </p>
                    </fieldset>

                    <label for="category">作品分類</label>
                    <select id="category" required>
                        <option value="animation">動畫作品</option>
                        <option value="video">影音作品</option>
                        <option value="game">遊戲作品</option>
                    </select>

                    <fieldset id="videoFields">
                        <legend id="videoFieldsTitle">動畫影片資料</legend>

                        <label for="youtubeSrc">YouTube 嵌入式 src 網址</label>
                        <input
                            id="youtubeSrc"
                            type="url"
                            maxlength="2000"
                            placeholder="https://www.youtube.com/embed/CC11UbcK9qM"
                        >

                        <p class="field-hint">
                            動畫與影音皆請貼上 YouTube iframe 的 src 引號內網址，不需要貼整段 iframe。
                        </p>
                    </fieldset>

                    <fieldset id="gameFields" hidden disabled>
                        <legend>遊戲資料</legend>

                        <label for="imageUrl">封面圖片</label>
                        <input
                            id="imageUrl"
                            maxlength="1000"
                            placeholder="images/圖片名稱.png 或 HTTPS 圖片網址"
                        >

                        <label for="genre">遊戲類型</label>
                        <input
                            id="genre"
                            maxlength="80"
                            placeholder="例如 2D Web Game"
                        >

                        <label for="year">年份</label>
                        <input
                            id="year"
                            type="number"
                            min="1900"
                            max="2100"
                            step="1"
                        >

                        <label for="externalUrl">試玩、下載或閱覽網址</label>
                        <input
                            id="externalUrl"
                            type="url"
                            maxlength="2000"
                            placeholder="https://..."
                        >

                        <label for="buttonText">按鈕文字</label>
                        <input
                            id="buttonText"
                            maxlength="40"
                            placeholder="例如 前往試玩"
                        >
                    </fieldset>

                    <label for="sortOrder">排序數字</label>
                    <input
                        id="sortOrder"
                        type="number"
                        min="0"
                        max="2147483647"
                        step="1"
                        value="10"
                        required
                    >

                    <p class="field-hint">數字越小，越前面顯示。</p>

                    <button type="submit" id="saveButton">
                        儲存作品
                    </button>
                </fieldset>
            </form>

            <p id="saveStatus" role="status"></p>
            <div id="manageWorks" hidden>
                <h2 id="worksHeading" tabindex="-1">已新增的作品</h2>

                <button type="button" id="reloadWorksButton">
                    重新整理清單
                </button>

                <p id="manageStatus" role="status"></p>

                <ul id="adminWorksList" class="admin-work-list"></ul>
            </div>
        </section>
    </main>

    <dialog
        id="deleteDialog"
        aria-labelledby="deleteDialogTitle"
        aria-describedby="deleteDialogMessage"
    >
        <h2 id="deleteDialogTitle">確認刪除作品</h2>

        <p id="deleteDialogMessage"></p>

        <p class="delete-note">
            刪除後無法從網頁復原，確定要繼續嗎？
        </p>

        <p id="deleteError" role="alert"></p>

        <div class="dialog-actions">
            <button type="button" id="cancelDeleteButton" autofocus>
                取消
            </button>

            <button
                type="button"
                id="confirmDeleteButton"
                class="confirm-delete-button"
            >
                確認
            </button>
        </div>
    </dialog>
    <dialog id="descriptionDialog" aria-labelledby="descriptionDialogTitle">
        <form id="descriptionForm">
            <h2 id="descriptionDialogTitle">編輯作品介紹與精華畫面</h2>
            <p id="descriptionWorkTitle"></p>
            <label for="editDescription">作品介紹</label>
            <textarea id="editDescription" rows="10" maxlength="10000"></textarea>
            <fieldset id="editImagesFields">
                <legend>作品精華畫面</legend>

                <div id="existingWorkImages" class="image-editor-list"></div>

                <label for="editWorkImages">追加精華圖片</label>
                <input
                    id="editWorkImages"
                    type="file"
                    accept="image/png,image/jpeg,image/webp"
                    multiple
                >

                <button type="button" id="uploadWorkImagesButton">
                    上傳所選圖片
                </button>

                <p class="field-hint">
                    每張上限 5 MB。圖片上傳、移除會立即儲存，
                    不受下方介紹文字的取消按鈕影響。
                </p>

                <p id="editImagesStatus" role="status"></p>
            </fieldset>
            <p id="descriptionError" role="alert"></p>
            <div class="dialog-actions">
                <button type="button" id="cancelDescription">取消</button>
                <button type="submit" id="saveDescription" class="confirm-delete-button">儲存</button>
            </div>
        </form>
    </dialog>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
